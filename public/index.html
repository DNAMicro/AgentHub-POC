<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A2A Spike Monitor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>A2A Spike Monitor</h1>
      <p class="subtitle">Student Agent ↔ Tutor Agent over A2A v1.0 JSON-RPC · forms in A2UI v0.9</p>
    </div>
    <div class="badges">
      <span class="badge" id="browser-feed" data-ok="false">Browser stream: connecting</span>
      <span class="badge" id="tutor-feed" data-ok="false">Tutor feed: unknown</span>
      <span class="badge" id="tutor-mode" data-mode="unknown">Tutor mode: unknown</span>
      <span class="state" id="state" data-state="idle">idle</span>
    </div>
  </header>

  <main>
    <div class="panels">
      <section class="panel" aria-labelledby="student-title">
        <h2 id="student-title">Student Agent <span class="role">A2A client</span></h2>
        <ol class="log" id="student-log" aria-live="polite"></ol>
        <div id="form-area" class="form-area" hidden></div>
        <form id="send-form" class="composer">
          <label for="message" class="visually-hidden">Message to Tutor Agent</label>
          <textarea id="message" rows="2" maxlength="2000" required>Hello Tutor Agent. Can you help me with calculus?</textarea>
          <button type="submit" id="send">Send</button>
        </form>
        <p class="privacy" id="privacy-note" hidden></p>
        <div class="actions">
          <span class="conversation" id="conversation">New conversation</span>
          <button type="button" id="new-conversation" hidden>New conversation</button>
          <button type="button" id="request-form" class="secondary">Request form</button>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
      </section>

      <section class="panel" aria-labelledby="tutor-title">
        <h2 id="tutor-title">Tutor Agent <span class="role">A2A server</span></h2>
        <ol class="log" id="tutor-log" aria-live="polite"></ol>
      </section>
    </div>

    <section class="timeline-panel" aria-labelledby="timeline-title">
      <h2 id="timeline-title">Activity timeline <span class="run-id" id="run-id">no run yet</span></h2>
      <ol class="timeline" id="timeline"></ol>
      <p class="timeline-error" id="timeline-error" role="alert"></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
